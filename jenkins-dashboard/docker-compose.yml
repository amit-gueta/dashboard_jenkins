version: '3.8'

services:
  postgres_db:
    image: postgres:13-alpine
    container_name: jenkins_dashboard_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-jenkins_dashboard}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: jenkins_dashboard_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@postgres_db:5432/jenkins_dashboard}
      PROJECT_NAME: "Jenkins Dashboard Backend"
      # Removed REDIS_URL and JENKINS_URLS specific to data_integration from here
      # Ensure any other necessary backend env vars are loaded from .env
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"] # Example
    #   interval: 15s
    #   timeout: 5s
    #   retries: 3


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jenkins_dashboard_frontend
    ports:
      - "3000:80" # Nginx in frontend container listens on 80
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
